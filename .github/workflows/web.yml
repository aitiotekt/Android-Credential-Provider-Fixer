name: Web

on:
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    outputs:
      should_deploy: ${{ steps.source.outputs.should_deploy }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          include-docs: "true"
          cache-mode: read-write
          cache-key-suffix: web
      - name: Validate deployment source
        id: source
        run: >-
          mise exec -- node scripts/dev-cli.mts release web-source
          --event-file="${GITHUB_EVENT_PATH}" --event-name="${GITHUB_EVENT_NAME}"
          --workflow-ref="${GITHUB_REF}" --workflow-sha="${GITHUB_SHA}"
          --repository="${GITHUB_REPOSITORY}" --format=github-output
      - name: Build both websites
        if: steps.source.outputs.should_deploy == 'true'
        run: |
          mise exec -- just build-docs
          mise exec -- pnpm --filter @aitiotekt/webauthn-web build
      - name: Assemble one Pages site
        if: steps.source.outputs.should_deploy == 'true'
        id: pages
        run: mise exec -- node scripts/build-web.mts
      - name: Upload Pages artifact
        if: steps.source.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.pages.outputs.path }}

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
