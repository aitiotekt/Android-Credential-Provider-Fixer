name: Web

on:
  push:
    branches: [main, release]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "CHANGELOG-ANDROID.md"
      - "LICENSE"
      - "docs/**"
      - "docsite/**"
      - "apps/webauthn-web/**"
      - "apps/tauri-app/config/**"
      - "scripts/build-web.mts"
      - "justfiles/**"
      - "scripts/dev-cli.mts"
      - "scripts/lib/**"
      - "package.json"
      - "acp-fixer-metadata.toml"
      - "pnpm-lock.yaml"
      - "mise*.toml"
      - ".github/actions/setup-workspace/action.yml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "CHANGELOG-ANDROID.md"
      - "LICENSE"
      - "docs/**"
      - "docsite/**"
      - "apps/webauthn-web/**"
      - "apps/tauri-app/config/**"
      - "scripts/build-web.mts"
      - "justfiles/**"
      - "scripts/dev-cli.mts"
      - "scripts/lib/**"
      - "package.json"
      - "acp-fixer-metadata.toml"
      - "pnpm-lock.yaml"
      - "mise*.toml"
      - ".github/actions/setup-workspace/action.yml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          include-docs: "true"
          cache-mode: read-write
          cache-key-suffix: web
      - name: Check managed documentation
        run: mise exec -- just check-docs
      - name: Install virtual test browsers
        run: mise exec -- pnpm --filter @aitiotekt/webauthn-web exec playwright install --with-deps chromium firefox
      - name: Verify WebAuthn site
        run: |
          mise exec -- pnpm --filter @aitiotekt/webauthn-web typecheck
          mise exec -- pnpm --filter @aitiotekt/webauthn-web test
          mise exec -- pnpm --filter @aitiotekt/webauthn-web test:browser
      - name: Build both websites
        run: |
          mise exec -- just build-docs
          mise exec -- pnpm --filter @aitiotekt/webauthn-web build
      - name: Assemble one Pages site
        id: pages
        run: mise exec -- node scripts/build-web.mts
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.pages.outputs.path }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
