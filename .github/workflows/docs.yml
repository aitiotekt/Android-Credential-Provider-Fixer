name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "docsite/**"
      - "scripts/dev-cli.mts"
      - "scripts/lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "mise*.toml"
      - ".github/actions/setup-workspace/action.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "docsite/**"
      - "scripts/dev-cli.mts"
      - "scripts/lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "mise*.toml"
      - ".github/actions/setup-workspace/action.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          include-docs: "true"
          cache-mode: read-write
          cache-key-suffix: docs
      - name: Check managed documentation
        run: mise exec -- just check-docs
      - name: Build VitePress site
        run: mise exec -- just build-docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docsite/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
