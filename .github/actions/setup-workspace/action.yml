name: Setup workspace
description: Install the pinned mise toolchain and workspace dependencies.

inputs:
  release-tools:
    description: Verify release-only tools in addition to the base toolchain; requires the release mise environment.
    required: false
    default: "false"
  include-docs:
    description: Install the independent VitePress workspace.
    required: false
    default: "false"
  cache-mode:
    description: Use read-write for one cache owner, read-only for consumers, or none.
    required: false
    default: read-only
  cache-key-suffix:
    description: Workflow-specific cache namespace with exactly one read-write owner.
    required: false
    default: workspace

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        install: true
        cache: true
        cache_key_prefix: mise-verified-v1

    - name: Verify mise tool executables
      shell: bash
      env:
        VERIFY_RELEASE_TOOLS: ${{ inputs.release-tools }}
      run: |
        verify_tool() {
          local tool="$1"
          shift
          if ! mise exec -- "$@"; then
            echo "::warning::Executable check failed for $tool; reinstalling the configured version once."
            mise install --force "$tool"
            mise exec -- "$@"
          fi
        }

        verify_tool node node --version
        verify_tool pnpm pnpm --version
        verify_tool just just --version
        verify_tool prek prek --version
        verify_tool rust rustc --version
        verify_tool rust cargo --version
        verify_tool rust cargo fmt --version
        verify_tool rust cargo clippy --version
        if [ "$VERIFY_RELEASE_TOOLS" = "true" ]; then
          verify_tool cargo:cargo-about cargo-about --version
        fi

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      if: inputs.cache-mode != 'none'
      id: pnpm-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'docsite/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-suffix }}-

    - name: Install application dependencies
      shell: bash
      run: mise exec -- pnpm install --frozen-lockfile

    - name: Install documentation dependencies
      if: inputs.include-docs == 'true'
      shell: bash
      run: mise exec -- pnpm --dir docsite install --frozen-lockfile

    - name: Save pnpm store
      if: inputs.cache-mode == 'read-write' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
