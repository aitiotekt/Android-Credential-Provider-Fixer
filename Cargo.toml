[workspace]
members = ["apps/cli", "apps/tauri-app/src-tauri", "packages/core", "packages/storage"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
authors = ["Zhou Yeheng <root@aitiotekt.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/aitiotekt/Android-Credential-Provider-Fixer"
publish = false

[workspace.dependencies]
acp-fixer-core = { path = "packages/core" }
acp-fixer-storage = { path = "packages/storage" }
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.22.0", features = ["v4"] }
